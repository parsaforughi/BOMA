<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قالب استوری - پنل ماموریت بازی</title>

    <style>
        body {
            /* پس‌زمینه تیره با الگوی شبکه‌ای (Grid) برای القای فضای دیجیتال و تکنولوژیک */
            background-color: #070b10;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* فونت‌های ماشینی و پیکسلی بهترین انتخاب برای این استایل هستند */
            font-family: 'Courier New', Courier, monospace, Tahoma;
        }

        .quest-panel {
            position: relative;
            width: 85vw;
            max-width: 450px;
            background: rgba(7, 11, 16, 0.9);
            backdrop-filter: blur(4px);
            
            /* حاشیه‌های تکنولوژیک: خط راست ضخیم‌تر به عنوان نوار اصلی پنل */
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-right: 4px solid #39ff14; /* سبز نئونی */
            
            padding: 25px 30px;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.1), inset 0 0 15px rgba(57, 255, 20, 0.05);
        }

        /* تزئینات گوشه‌های پنل (Tech Brackets) */
        .quest-panel::before, .quest-panel::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid #39ff14;
            pointer-events: none;
        }
        
        .quest-panel::before {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }
        
        .quest-panel::after {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        /* هدر ماموریت (عنوان بالای کادر) */
        .quest-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #39ff14;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px dashed rgba(57, 255, 20, 0.3);
            padding-bottom: 12px;
        }

        /* آیکون هشدار با انیمیشن چشمک‌زن */
        .quest-header svg {
            width: 20px;
            height: 20px;
            fill: #39ff14;
            animation: radar-pulse 1.5s infinite;
        }

        @keyframes radar-pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* بخش اصلی شامل چک‌باکس و متن */
        .quest-item {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        /* مربع خالی کنار متن (شبیه به تسک‌های بازی) */
        .checkbox {
            width: 16px;
            height: 16px;
            border: 2px solid #39ff14;
            margin-top: 5px;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
            position: relative;
        }
        
        /* یک نقطه کوچک داخل چک‌باکس */
        .checkbox::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: rgba(57, 255, 20, 0.3);
        }

        /* کادر متنی که کاربر تایپ می‌کند */
        .text-box {
            color: #d1d5db;
            font-size: 1.15rem;
            line-height: 1.6;
            outline: none;
            cursor: text;
            text-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
            min-height: 30px;
        }

        /* افکت روشن‌تر شدن متن هنگام تایپ */
        .text-box:focus {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
            transition: all 0.2s ease;
        }

        /* باکس پاداش در پایین پنل */
        .xp-reward {
            margin-top: 25px;
            display: inline-flex;
            align-items: center;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid rgba(57, 255, 20, 0.3);
            color: #39ff14;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="quest-panel">
        
        <!-- هدر پنل (قابل ویرایش) -->
        <div class="quest-header">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L1 21h22L12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/>
            </svg>
            <span contenteditable="true" dir="auto">مأموریت جدید</span>
        </div>
        
        <!-- بدنه ماموریت -->
        <div class="quest-item">
            <div class="checkbox"></div>
            <div class="text-box" contenteditable="true" dir="auto">
                کدهای استایل رابط کاربری گیمینگ را بررسی کن و یک خروجی بی‌نقص برای استوری اینستاگرام آماده کن.
            </div>
        </div>
        
        <!-- باکس پاداش (XP) -->
        <div class="xp-reward" contenteditable="true" dir="ltr">
            REWARD: +500 XP
        </div>

    </div>

</body>
</html>
