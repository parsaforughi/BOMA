<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قالب استوری - پست توییتر / X (ثابت)</title>

    <style>
        body {
            background-color: #242d34;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .tweet-card {
            background-color: #000000;
            width: 85vw;
            max-width: 450px;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 16px;
            color: #e7e9ea;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            direction: ltr; 
        }

        .tweet-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            /* غیرفعال کردن انتخاب متن برای جلوگیری از مزاحمت موقع کلیک */
            user-select: none; 
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            /* یک پس‌زمینه خاکستری خنثی برای حالت قالب بودن */
            background: #333639;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .avatar svg {
            width: 24px;
            height: 24px;
            fill: #71767b;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .display-name {
            font-weight: 700;
            font-size: 1rem;
            color: #e7e9ea;
        }

        .verified-badge {
            width: 18px;
            height: 18px;
            fill: #1d9bf0;
        }

        .username {
            color: #71767b;
            font-size: 0.95rem;
        }

        /* متن اصلی توییت (تنها بخش قابل ویرایش) */
        .tweet-text {
            font-size: 1.25rem;
            line-height: 1.5;
            margin-bottom: 16px;
            outline: none;
            cursor: text;
            unicode-bidi: plaintext;
            text-align: right;
            word-wrap: break-word;
        }

        .tweet-text:focus {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .tweet-metadata {
            color: #71767b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2f3336;
            margin-bottom: 12px;
            user-select: none;
        }

        .metadata-dot {
            font-size: 0.8rem;
            padding: 0 4px;
        }

        .tweet-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #71767b;
            padding: 0 4px;
            user-select: none;
        }

        .action-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .action-item svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="tweet-card">
        
        <!-- هدر ثابت -->
        <div class="tweet-header">
            <div class="avatar">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            
            <div class="user-info">
                <div class="name-row">
                    <!-- متن ثابت شد -->
                    <div class="display-name">Account Name</div>
                    <svg class="verified-badge" viewBox="0 0 24 24">
                        <g><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.918-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.337 2.25c-.416-.165-.866-.25-1.336-.25-2.21 0-3.918 1.79-3.918 4 0 .495.084.965.238 1.4-1.273.65-2.148 2.02-2.148 3.6 0 1.46.758 2.76 1.887 3.45-.068.286-.104.58-.104.88 0 2.21 1.71 3.998 3.918 3.998.505 0 .99-.098 1.43-.268.53.94 1.55 1.57 2.72 1.57s2.19-.63 2.72-1.57c.44.17.925.268 1.43.268 2.21 0 3.918-1.79 3.918-4 0-.298-.036-.592-.104-.878 1.13-.693 1.888-1.992 1.888-3.452zm-10.08 4.08l-3.32-3.33 1.41-1.42 1.91 1.92 5.08-5.09 1.42 1.42-6.5 6.5z"/></g>
                    </svg>
                </div>
                <!-- متن ثابت شد -->
                <div class="username">@username</div>
            </div>
        </div>

        <!-- تنها بخش قابل ویرایش -->
        <div class="tweet-text" contenteditable="true" dir="auto">
            متن خود را اینجا بنویسید. بقیه بخش‌های این قالب کاملاً ثابت هستند.
        </div>

        <!-- آمار و اطلاعات ثابت -->
        <div class="tweet-metadata" dir="ltr">
            Post Template <span class="metadata-dot">•</span> Web App <span class="metadata-dot">•</span> <strong>10K</strong> Views
        </div>

        <!-- دکمه‌های تعاملی ثابت -->
        <div class="tweet-actions">
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/></svg>
                <span>124</span>
            </div>
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg>
                <span>45</span>
            </div>
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg>
                <span>8.2K</span>
            </div>
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z"/></svg>
            </div>
        </div>

    </div>

</body>
</html>
