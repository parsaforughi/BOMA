<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قالب استوری - نوتیفیکیشن آیفون</title>

    <style>
        body {
            /* یک والپیپر رنگارنگ شبیه به بک‌گراند آیفون برای نمایش بهتر افکت شیشه */
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* انیمیشن ملایم پس‌زمینه */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* کادر کلی 노تیفیکیشن */
        .ios-notification {
            width: 85vw;
            max-width: 400px;
            
            /* افکت شیشه‌ای (Glassmorphism) */
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            
            border-radius: 24px;
            /* سایه بسیار نرم و پخش شده */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* بخش هدر (بالای نوتیفیکیشن) */
        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 8px 16px;
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* آیکون اپلیکیشن (مثلا آیکون Message آیفون) */
        .app-icon {
            width: 20px;
            height: 20px;
            background: #34c759; /* رنگ سبز پیام‌ها */
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-icon svg {
            width: 12px;
            height: 12px;
            fill: #ffffff;
        }

        .app-name {
            font-size: 0.8rem;
            color: rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .time-ago {
            font-size: 0.8rem;
            color: rgba(0, 0, 0, 0.5);
        }

        /* بدنه و متن نوتیفیکیشن */
        .notif-body {
            padding: 0 16px 16px 16px;
        }

        /* تیتر یا نام فرستنده (قابل ویرایش) */
        .sender-name {
            font-weight: 600;
            font-size: 1rem;
            color: #000000;
            margin-bottom: 4px;
            outline: none;
        }

        /* متن اصلی پیام (قابل ویرایش) */
        .text-box {
            font-size: 0.95rem;
            color: #1a1a1a;
            line-height: 1.4;
            outline: none;
            cursor: text;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="ios-notification">
        <!-- هدر نوتیفیکیشن -->
        <div class="notif-header">
            <div class="app-info">
                <!-- آیکون اپلیکیشن -->
                <div class="app-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
                    </svg>
                </div>
                <span class="app-name">پیام‌ها</span>
            </div>
            <span class="time-ago">همین الان</span>
        </div>
        
        <!-- بدنه نوتیفیکیشن -->
        <div class="notif-body">
            <!-- نام فرستنده -->
            <div class="sender-name" contenteditable="true">
                اینستاگرام
            </div>
            <!-- متن پیام -->
            <div class="text-box" contenteditable="true">
                طراحی نوتیفیکیشن آیفون شما با موفقیت آماده شد. روی این متن کلیک کنید و پیام دلخواه خود را بنویسید!
            </div>
        </div>
    </div>

</body>
</html>
